# ============================================================
# Zephyr Project Configuration
# ============================================================

# Console / printk
CONFIG_PRINTK=y

# Assertions
CONFIG_ASSERT=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Main thread stack
CONFIG_MAIN_STACK_SIZE=2048

# ------------------------------------------------------------
# Add project-specific configuration below
# ------------------------------------------------------------

# ---------------------------------------------------------
# DEOS Core Prototype
# ---------------------------------------------------------

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# CAN desteği
CONFIG_CAN=y
CONFIG_CAN_FD_MODE=y

# ---------------------------------------------------------
# DEOS Core Configuration (Optional overrides)
# ---------------------------------------------------------
# CONFIG_DEOS_MAX_LOCAL_NODES=4
# CONFIG_DEOS_MAX_FAULT_RECORDS=32
# CONFIG_DEOS_MAX_HANDLERS=32
# CONFIG_DEOS_RX_QUEUE_SIZE=16
# CONFIG_DEOS_RX_THREAD_STACK_SIZE=1024
# CONFIG_DEOS_RX_THREAD_PRIORITY=5

# ---------------------------------------------------------
# LoRa UART & GPIO settings
# ---------------------------------------------------------
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_GPIO=y

# ---------------------------------------------------------
# CRC Support for LoRa
# ---------------------------------------------------------
CONFIG_CRC=y

# ---------------------------------------------------------
# Networking / Ethernet / TCP Sockets
# ---------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
# Maksimum bağlantı ve soket ayarları
CONFIG_NET_MAX_CONN=4
CONFIG_NET_MAX_CONTEXTS=4

# İsteğe bağlı Statik IP ayarı (Eğer DHCP yoksa)
# RPi tarafı ile aynı ağda (örn: 192.168.1.x) olmalıdır
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.10"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="192.168.1.1"

# Ethernet kablosu takılı değilse veya link gecikirse Zephyr'in bootta beklemesini engelle
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
# ---------------------------------------------------------
# C++ Support
# ---------------------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# ---------------------------------------------------------
# ROS 2 UDP Bridge Support
# ---------------------------------------------------------
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=y

CONFIG_POSIX_API=y
